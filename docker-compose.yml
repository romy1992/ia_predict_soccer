services:
  # NOTA: nessun servizio Postgres containerizzato. Il DB e' SEMPRE il remoto
  # "dev" ospitato su Railway (richiesto esplicitamente 2026-09-04, sostituisce
  # il precedente Postgres nativo Windows su localhost:5432 come sorgente di
  # riferimento per locale/Docker/training - vedi README_PLATFORM.md, sezione
  # "Policy DATABASE_URL"). `DATABASE_URL` NON viene piu' sovrascritto qui
  # sotto `environment:` per nessun servizio: e' unica sorgente di verita'
  # `properties/config.env` (via `env_file`), per evitare che i due valori
  # divergano di nuovo (bug corretto il 2026-09-04: `api` era rimasto
  # agganciato al vecchio DB locale mentre `scheduler` gia' puntava a
  # Railway). `extra_hosts`/`host.docker.internal` restano configurati per
  # compatibilita' con eventuali altri usi locali futuri.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: soccer_api
    restart: unless-stopped
    env_file:
      - properties/config.env
    environment:
      API_ODDS_ACTUAL_BASE: https://api.the-odds-api.com/v4/sports
      API_ODDS_HISTORIACAL_BASE: https://api.the-odds-api.com/v4/historical/sports
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./best_models:/app/best_models
      - ./logs:/app/logs
    # Limite esplicito: il training ML (GridSearchCV multi-mercato) puo'
    # saturare CPU/RAM della VM Docker fino a far uccidere il processo con
    # SIGKILL esterno (osservato 2 volte, OOMKilled=false -> non e' il
    # cgroup del container a intervenire, ma qualcosa di piu' esterno,
    # verosimilmente Docker Desktop/WSL2). Con un limite esplicito, se la
    # memoria satura e' IL CONTAINER a andare in OOM in modo controllato
    # (OOMKilled=true, riconosciuto da `restart: unless-stopped`), non la
    # VM intera.
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: soccer_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: soccer_scheduler
    command: ["python", "-m", "src.jobs.scheduler"]
    restart: unless-stopped
    env_file:
      - properties/config.env
    environment:
      API_ODDS_ACTUAL_BASE: https://api.the-odds-api.com/v4/sports
      API_ODDS_HISTORIACAL_BASE: https://api.the-odds-api.com/v4/historical/sports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./best_models:/app/best_models
      - ./logs:/app/logs

